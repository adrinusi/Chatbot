<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>Menu Pintar — Temukan menu hari ini</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#20271f",
            muted: "#788076",
            green: { DEFAULT: "#245c43", dark: "#194733" },
            mint: "#e8f1e9",
            paper: "#fffefa",
            line: "#e8e8df"
          },
          boxShadow: {
            app: "0 24px 70px #253d2b14"
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-[#f7f5ef] font-sans text-ink">
  <div class="page-background mx-auto grid min-h-screen w-[calc(100%-32px)] max-w-[960px] place-items-center py-7 max-[600px]:w-full max-[600px]:py-0">
    <section class="flex h-[min(820px,calc(100vh-56px))] min-h-[540px] w-full flex-col overflow-hidden rounded-[28px] border border-white bg-paper shadow-app max-[600px]:h-screen max-[600px]:min-h-0 max-[600px]:rounded-none max-[600px]:border-0" aria-label="Chat Menu Pintar">
      <header class="flex items-center justify-between gap-4 border-b border-line px-[26px] py-5 max-[600px]:px-[17px] max-[600px]:py-[15px]">
        <div class="flex items-center gap-3">
          <div class="grid h-11 w-11 place-items-center rounded-[15px] bg-mint text-[23px]" aria-hidden="true">🥣</div>
          <div>
            <p class="m-0 text-[17px] font-[750] tracking-[-.03em]">Menu Pintar</p>
            <p class="mt-[3px] text-xs text-muted max-[600px]:text-[11px]">Teman cari ide makan</p>
          </div>
        </div>
        <button class="rounded-xl border border-line bg-transparent px-[13px] py-[9px] text-xs font-[650] text-[#5f665e] transition-[background,border-color] duration-200 hover:border-[#cbd8cc] hover:bg-[#f5f8f3] disabled:cursor-wait disabled:opacity-60" id="reset" type="button">Chat baru</button>
      </header>

      <main class="flex-1 scroll-smooth overflow-y-auto px-[clamp(18px,6vw,64px)] py-[30px] max-[600px]:px-4 max-[600px]:py-[22px]" id="chat" aria-live="polite">
        <section class="mx-auto mb-[30px] mt-[14px] max-w-[620px] text-center max-[600px]:mt-[9px]" id="welcome">
          <span class="inline-flex items-center gap-[7px] rounded-full border border-[#e6ecdf] bg-[#f5f8f1] px-[11px] py-[7px] text-[11px] font-bold tracking-[.03em] text-green"><span aria-hidden="true">✦</span> IDE MAKANAN HARI INI</span>
          <h1 class="mb-[9px] mt-[17px] text-[clamp(27px,5vw,40px)] font-bold leading-[1.12] tracking-[-.055em]">Lagi pengin makan apa?</h1>
          <p class="mx-auto max-w-[470px] text-sm leading-[1.7] text-muted">Ceritakan suasana hati, selera, atau budget kamu. Aku bantu pilihkan menu yang pas.</p>
          <div class="mx-auto mt-6 grid max-w-[590px] grid-cols-2 gap-[10px] max-[600px]:mt-5 max-[600px]:grid-cols-1 max-[600px]:gap-2">
            <button class="suggestion rounded-[15px] border border-line bg-white px-[15px] py-[13px] text-left text-xs leading-[1.5] text-[#454d44] transition-[transform,border-color,background] duration-[180ms] hover:-translate-y-0.5 hover:border-[#bdd0c0] hover:bg-[#fbfdf9] max-[600px]:px-[13px] max-[600px]:py-[11px]" type="button">Aku mau yang hangat dan berkuah</button>
            <button class="suggestion rounded-[15px] border border-line bg-white px-[15px] py-[13px] text-left text-xs leading-[1.5] text-[#454d44] transition-[transform,border-color,background] duration-[180ms] hover:-translate-y-0.5 hover:border-[#bdd0c0] hover:bg-[#fbfdf9] max-[600px]:px-[13px] max-[600px]:py-[11px]" type="button">Rekomendasi makan enak di bawah Rp25.000</button>
            <button class="suggestion rounded-[15px] border border-line bg-white px-[15px] py-[13px] text-left text-xs leading-[1.5] text-[#454d44] transition-[transform,border-color,background] duration-[180ms] hover:-translate-y-0.5 hover:border-[#bdd0c0] hover:bg-[#fbfdf9] max-[600px]:px-[13px] max-[600px]:py-[11px]" type="button">Ada telur dan tahu, enaknya dimasak apa?</button>
            <button class="suggestion rounded-[15px] border border-line bg-white px-[15px] py-[13px] text-left text-xs leading-[1.5] text-[#454d44] transition-[transform,border-color,background] duration-[180ms] hover:-translate-y-0.5 hover:border-[#bdd0c0] hover:bg-[#fbfdf9] max-[600px]:px-[13px] max-[600px]:py-[11px]" type="button">Kasih ide makan malam yang simpel</button>
          </div>
        </section>
        <div class="mx-auto flex max-w-[680px] flex-col gap-[18px]" id="messages"></div>
      </main>

      <div class="border-t border-line bg-paper px-[clamp(18px,6vw,64px)] pb-[18px] pt-[14px] max-[600px]:px-[14px] max-[600px]:pb-[max(14px,env(safe-area-inset-bottom))] max-[600px]:pt-3">
        <form class="mx-auto max-w-[680px]" id="form">
          <div class="flex items-end gap-[10px] rounded-[18px] border border-[#dedfd6] bg-white py-[9px] pl-4 pr-[10px] shadow-[0_4px_15px_#20271f08] transition-[border-color,box-shadow] duration-200 focus-within:border-[#90ad96] focus-within:shadow-[0_0_0_3px_#245c4310]">
            <textarea class="min-h-10 max-h-[130px] w-full resize-none border-0 bg-transparent py-[9px] text-sm leading-[1.5] text-ink outline-none placeholder:text-[#9a9f96]" id="input" rows="1" maxlength="4000" placeholder="Tulis pesanmu di sini..." aria-label="Pesan untuk Menu Pintar"></textarea>
            <button class="grid h-[42px] w-[42px] flex-[0_0_42px] place-items-center rounded-[13px] border-0 bg-green text-white transition-[background,transform] duration-200 enabled:hover:-translate-y-px enabled:hover:bg-green-dark disabled:cursor-wait disabled:opacity-[.55]" id="send" type="submit" aria-label="Kirim pesan">
              <svg class="h-[19px] w-[19px]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <p class="mb-0 mt-[9px] text-center text-[10px] text-[#969b93]">Enter untuk mengirim · Shift + Enter untuk baris baru</p>
        </form>
      </div>
    </section>
  </div>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const reset = document.getElementById("reset");
    const chat = document.getElementById("chat");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    let waiting = false;

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function appendInlineMarkdown(element, text) {
      const tokenPattern = /(\*\*[^*]+\*\*|__[^_]+__|`[^`]+`|\*[^*]+\*|_[^_]+_)/g;
      let start = 0;
      let match;

      while ((match = tokenPattern.exec(text)) !== null) {
        element.append(document.createTextNode(text.slice(start, match.index)));
        const token = match[0];
        const tag = token.startsWith("**") || token.startsWith("__")
          ? "strong"
          : token.startsWith("`")
            ? "code"
            : "em";
        const content = token.startsWith("**") || token.startsWith("__")
          ? token.slice(2, -2)
          : token.slice(1, -1);
        const formatted = document.createElement(tag);
        formatted.textContent = content;
        element.append(formatted);
        start = tokenPattern.lastIndex;
      }

      element.append(document.createTextNode(text.slice(start)));
    }

    function renderAssistantText(element, text) {
      const lines = text.replace(/\r\n?/g, "\n").split("\n");
      let paragraph = [];
      let list = null;
      let listTag = "";

      function flushParagraph() {
        if (!paragraph.length) return;
        const node = document.createElement("p");
        node.className = "mb-[10px] mt-0 last:mb-0";
        appendInlineMarkdown(node, paragraph.join(" "));
        element.append(node);
        paragraph = [];
      }

      function closeList() {
        list = null;
        listTag = "";
      }

      for (const line of lines) {
        const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
        const unordered = line.match(/^\s*[-*]\s+(.+)$/);
        const item = ordered || unordered;

        if (!line.trim()) {
          flushParagraph();
          closeList();
          continue;
        }

        if (item) {
          flushParagraph();
          const nextListTag = ordered ? "ol" : "ul";
          if (listTag !== nextListTag) {
            closeList();
            list = document.createElement(nextListTag);
            list.className = `${nextListTag === "ol" ? "list-decimal" : "list-disc"} mb-3 mt-0 pl-[22px]`;
            listTag = nextListTag;
            element.append(list);
          }
          const listItem = document.createElement("li");
          listItem.className = `pl-0.5${list.children.length ? " mt-[5px]" : ""}`;
          appendInlineMarkdown(listItem, item[1]);
          list.append(listItem);
          continue;
        }

        closeList();
        paragraph.push(line.trim());
      }

      flushParagraph();
    }

    function addMessage(role, text) {
      const row = document.createElement("div");
      row.className = `flex animate-chat-appear items-start gap-[10px]${role === "user" ? " justify-end" : ""}`;

      if (role === "assistant") {
        const avatar = document.createElement("span");
        avatar.className = "grid h-[30px] w-[30px] flex-[0_0_30px] place-items-center rounded-[11px] bg-mint text-base";
        avatar.setAttribute("aria-hidden", "true");
        avatar.textContent = "🥣";
        row.append(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = `bubble max-w-[min(82%,540px)] rounded-[5px_17px_17px_17px] border border-[#e9e9e2] bg-white px-[15px] py-3 text-sm leading-[1.65] text-[#343c34] max-[600px]:max-w-[88%] max-[600px]:text-[13px]${role === "assistant" ? " whitespace-normal" : " whitespace-pre-wrap"}${role === "user" ? " rounded-[17px_5px_17px_17px] border-green bg-green text-white" : ""}`;
      if (role === "assistant") {
        renderAssistantText(bubble, text);
      } else {
        bubble.textContent = text;
      }
      row.append(bubble);
      messages.append(row);
      scrollToBottom();
      return row;
    }

    function setWaiting(value) {
      waiting = value;
      send.disabled = value;
      reset.disabled = value;
      input.disabled = value;
    }

    function showTyping() {
      const row = addMessage("assistant", "");
      const bubble = row.querySelector(".bubble");
      bubble.setAttribute("aria-label", "MenuPintar sedang mengetik");
      bubble.innerHTML = '<span class="inline-flex gap-1 px-0.5 py-1" aria-hidden="true"><i class="typing-dot"></i><i class="typing-dot"></i><i class="typing-dot"></i></span>';
      return row;
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message || waiting) return;

      welcome.hidden = true;
      addMessage("user", message);
      input.value = "";
      input.style.height = "auto";
      setWaiting(true);
      const typing = showTyping();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Pesan gagal dikirim.");
        typing.remove();
        addMessage("assistant", result.answer);
      } catch (error) {
        typing.remove();
        addMessage("assistant", `Maaf, pesan gagal dikirim. ${error.message}`);
      } finally {
        setWaiting(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 130)}px`;
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll(".suggestion").forEach((button) => {
      button.addEventListener("click", () => sendMessage(button.textContent));
    });

    reset.addEventListener("click", async () => {
      if (waiting) return;
      reset.disabled = true;
      try {
        const response = await fetch("/api/reset", { method: "POST" });
        if (!response.ok) throw new Error("Riwayat chat gagal dihapus.");
        messages.replaceChildren();
        welcome.hidden = false;
        input.value = "";
        input.focus();
      } catch (error) {
        addMessage("assistant", error.message);
      } finally {
        reset.disabled = false;
      }
    });
  </script>
</body>
</html>
